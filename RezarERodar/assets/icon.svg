<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="skyGrad" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffe600" />
      <stop offset="50%" stop-color="#009c3b" />
      <stop offset="100%" stop-color="#002776" />
    </radialGradient>
    <linearGradient id="tireGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#404040"/>
      <stop offset="50%" stop-color="#151515"/>
      <stop offset="100%" stop-color="#080808"/>
    </linearGradient>
    <linearGradient id="rimGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e0e0e0"/>
      <stop offset="100%" stop-color="#707070"/>
    </linearGradient>
  </defs>
  <!-- Background Disc -->
  <rect width="128" height="128" rx="28" fill="url(#skyGrad)"/>
  
  <!-- Divine Rays -->
  <path d="M64 4 L68 35 L64 30 L60 35 Z" fill="#ffffff" opacity="0.6"/>
  <path d="M20 20 L45 42 L40 40 L38 45 Z" fill="#ffffff" opacity="0.5"/>
  <path d="M108 20 L90 45 L88 40 L83 42 Z" fill="#ffffff" opacity="0.5"/>
  
  <!-- Sacred Tire -->
  <circle cx="64" cy="72" r="38" fill="url(#tireGrad)" stroke="#ffdf00" stroke-width="4"/>
  <circle cx="64" cy="72" r="24" fill="#222"/>
  <circle cx="64" cy="72" r="15" fill="url(#rimGrad)"/>
  <circle cx="64" cy="72" r="6" fill="#111"/>
  
  <!-- Yellow ribbon around tire -->
  <path d="M30 65 Q64 85 98 65" stroke="#ffe600" stroke-width="5" fill="none"/>
  
  <!-- Little praying hands icon above tire -->
  <path d="M60 22 C60 18 64 16 64 16 C64 16 68 18 68 22 L68 32 L60 32 Z" fill="#ffccaa"/>
  
  <!-- Text Label -->
  <text x="64" y="122" font-family="sans-serif" font-weight="900" font-size="11" text-anchor="middle" fill="#ffffff">REZAR &amp; RODAR</text>
